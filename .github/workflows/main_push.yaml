name: Push on main (Check & Deploy)

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yaml

  build_and_deploy_app_builder:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      image-name: marble-frontend
      dockerfile: ./Dockerfile
      dockerfile-target-stage: app-builder
      version: latest
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build_and_deploy_backoffice:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      image-name: marble-backoffice
      dockerfile: ./Dockerfile.backoffice
      dockerfile-target-stage: backoffice
      version: latest
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
