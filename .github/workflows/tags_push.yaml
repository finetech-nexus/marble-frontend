name: Push a tag (Check & Deploy)

on:
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+" # stable
      - "v[0-9]+\\.[0-9]+\\.[0-9]+-rc\\.[0-9]+" # release candidate (e.g. v1.2.0-rc.1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/check.yaml

  build_and_deploy_app_builder:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      image-name: marble-frontend
      dockerfile: ./Dockerfile
      dockerfile-target-stage: app-builder
      version: ${{ github.ref_name }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  build_and_deploy_backoffice:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build_and_deploy.yaml
    with:
      image-name: marble-backoffice
      dockerfile: ./Dockerfile.backoffice
      dockerfile-target-stage: backoffice
      version: ${{ github.ref_name }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
