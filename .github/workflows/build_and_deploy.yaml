# Build and push a Marble frontend image to Docker Hub.
# Tags: the requested version and the short commit SHA.
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push image

on:
  workflow_call:
    inputs:
      image-name:
        type: string
        description: Image name on Docker Hub
        required: true
      version:
        type: string
        description: Tag to publish
        required: true
      dockerfile:
        type: string
        description: Dockerfile to use
        required: true
      dockerfile-target-stage:
        type: string
        description: Dockerfile target stage to build
        required: true
    secrets:
      DOCKER_USER:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version from tag
        id: version
        run: echo "MARBLE_VERSION=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.dockerfile-target-stage }}
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.MARBLE_VERSION }}
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ inputs.image-name }}:${{ inputs.version }}
            ${{ env.DOCKER_ORGANIZATION }}/${{ inputs.image-name }}:${{ steps.sha.outputs.short_sha }}
